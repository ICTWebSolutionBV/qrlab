version: 2

# Dependabot was only surfacing npm alerts for this repo: the five guzzle advisories
# that composer audit caught were never reported. Declaring the composer ecosystem
# explicitly gives the PHP side the same coverage, and github-actions keeps the pinned
# action SHAs in ci.yml from going stale.
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine in-range bumps; security fixes still come through separately
      # and immediately, so they are never buried in a group.
      php-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # concurrently 10 requires Node >=22, which would drop the Node 20.19 LTS
      # line that the rest of the toolchain still supports. Staying on 9.x is a
      # deliberate choice, not staleness - see the commit that reverted 10.0.4.
      # Patch and minor updates within 9.x still come through.
      - dependency-name: concurrently
        update-types:
          - version-update:semver-major
    groups:
      js-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
