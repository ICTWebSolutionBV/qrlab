name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so a newly published advisory surfaces without waiting for a push.
    - cron: '17 6 * * *'
  workflow_dispatch:

# Least privilege: nothing here needs write access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deliberately a single job. The two toolchains are not separable here: the asset
# build needs vendor/tightenco/ziggy (aliased in vite.config.js), and the feature
# tests render views that need public/build/manifest.json. Split jobs would each
# have to install both PHP and Node, costing more total compute than one job.
# Steps are ordered cheapest-failure-first so a known advisory stops the run
# before the build and test steps.
jobs:
  ci:
    name: Audit, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, gmp, mbstring, intl, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Resolve composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Fails the build on any known advisory in the locked PHP dependencies.
      # This is the gap that previously let five guzzle advisories ship unnoticed.
      - name: Audit PHP dependencies
        run: composer audit

      - name: Validate composer manifest against lock
        run: composer validate --no-check-publish --strict

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts matches .npmrc; lifecycle scripts from dependencies do not run.
      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Audit JS dependencies
        run: npm audit --audit-level=moderate

      # Must precede the tests: feature tests render views that read the Vite manifest.
      - name: Build assets
        run: npm run build

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite
        run: php artisan test
