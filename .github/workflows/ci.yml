name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so a newly published advisory surfaces without waiting for a push.
    - cron: '17 6 * * *'
  workflow_dispatch:

# Least privilege: nothing here needs write access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP (audit + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: bcmath, gmp, mbstring, intl, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Resolve composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Fails the build on any known advisory in the locked PHP dependencies.
      # This is the gap that previously let five guzzle advisories ship unnoticed.
      - name: Audit PHP dependencies
        run: composer audit

      - name: Validate composer manifest against lock
        run: composer validate --no-check-publish --strict

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite
        run: php artisan test

  js:
    name: JS (audit + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts matches .npmrc; lifecycle scripts from dependencies do not run.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit JS dependencies
        run: npm audit --audit-level=moderate

      - name: Build assets
        run: npm run build
